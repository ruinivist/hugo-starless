<div class="theme-picker">
  <label for="theme-picker">
    theme
    <select id="theme-picker" data-theme-picker>
      <option value="vermillion-skies" data-chroma-style="gruvbox">vermillion skies</option>
      <option value="classique" data-chroma-style="kanagawa-wave">classique</option>
      <option value="muted-blossom" data-chroma-style="kanagawa-dragon">muted blossom</option>
      <option value="moss" data-chroma-style="evergarden">moss</option>
      <option value="ocean" data-chroma-style="tokyonight-storm">ocean</option>
      <option value="lake" data-chroma-style="nord">lake</option>
      <option value="zen" data-chroma-style="kanagawa-dragon">zen</option>
      <option value="blossom" data-chroma-style="lovelace">blossom</option>
      <option value="ink" data-chroma-style="tokyonight-night">ink</option>
      <option value="frost" data-chroma-style="catppuccin-latte">frost</option>
      <option value="paper" data-chroma-style="manni">paper</option>
      <option value="classique-light" data-chroma-style="rose-pine-dawn">classique light</option>
    </select>
  </label>
  <div class="highlight"><pre tabindex="0" class="chroma"><code class="language-css" data-lang="css" data-theme-code></code></pre></div>
  <p>Chroma theme: <code data-chroma-style-output></code></p>
</div>

<script>
  (() => {
    const root = document.documentElement;
    const picker = document.querySelector("[data-theme-picker]");
    const code = document.querySelector("[data-theme-code]");
    const chromaStyle = document.querySelector("[data-chroma-style-output]");
    const chromaThemes = document.querySelectorAll("[data-chroma-theme]");
    const properties = [
      "surface", "surface-low", "surface-lowest-soft", "surface-backdrop",
      "text", "text-soft", "text-muted", "text-muted-soft", "text-muted-faint", "text-underline",
      "primary", "primary-soft", "primary-container", "on-primary-container",
      "line", "line-soft", "line-strong", "outline"
    ];

    const applyTheme = () => {
      root.dataset.theme = picker.value;
      chromaStyle.textContent = picker.selectedOptions[0].dataset.chromaStyle;
      chromaThemes.forEach((theme) => {
        theme.disabled = theme.dataset.chromaTheme !== picker.value;
      });
      const styles = getComputedStyle(root);
      const declarations = properties.map((property) =>
        `  --${property}: ${styles.getPropertyValue(`--${property}`).trim()};`
      );
      code.textContent = `:root {\n  color-scheme: ${styles.colorScheme};\n${declarations.join("\n")}\n}`;
    };

    picker.addEventListener("change", applyTheme);
    applyTheme();
  })();
</script>
